name: CI / CD

on:
  pull_request:
  push:
    branches: [develop, release]
    tags: ["v*"]

jobs:
  # ── Generate project + compile (fail fast) ────────────────────────────────
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep "^Xcode_16" | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install xcodegen
          gem install xcpretty --no-document

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile
        run: |
          set -o pipefail
          xcodebuild build \
            -project StreamvaultWatch.xcodeproj \
            -scheme StreamvaultWatch \
            -destination 'platform=watchOS Simulator,OS=latest,name=Apple Watch Series 9 (45mm)' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  # ── Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep "^Xcode_16" | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"

      - name: Install dependencies
        run: |
          brew install xcodegen
          gem install xcpretty --no-document

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project StreamvaultWatch.xcodeproj \
            -scheme StreamvaultWatch \
            -destination 'platform=watchOS Simulator,OS=latest,name=Apple Watch Series 9 (45mm)' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit --output TestResults/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults/junit.xml
          retention-days: 7

